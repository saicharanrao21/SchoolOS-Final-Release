version: '3.8'

services:
  # PostgreSQL Production Primary Database
  postgres:
    image: postgres:16-alpine
    container_name: schoolos_postgres
    restart: always
    environment:
      POSTGRES_USER: schoolos_user
      POSTGRES_PASSWORD: schoolos_password
      POSTGRES_DB: schoolos_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U schoolos_user -d schoolos_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache & Queue Storage
  redis:
    image: redis:7-alpine
    container_name: schoolos_redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # NestJS API Service
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: schoolos_api
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://schoolos_user:schoolos_password@postgres:5432/schoolos_db?schema=public
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=replace-with-a-secure-production-jwt-secret
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Next.js Command Center Web UI
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: schoolos_web
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=3001
      - NEXT_PUBLIC_API_URL=http://localhost:3000/api/v1
    ports:
      - "3001:3001"
    depends_on:
      - api

volumes:
  postgres_data:
